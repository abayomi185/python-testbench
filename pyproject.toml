[project]
name = "python-testbench"
version = "0.1.0"
description = "Testbench for all things python"
authors = [{ name = "Yomi Ikuru" }]
dependencies = ["numpy", "pandas"]
requires-python = ">=3.13"

[project.urls]
repository = "https://github.com/abayomi185/python_testbench"

[dependency-groups]
dev = [
    "ruff>=0.14.5",
    "pytest>=7.2.2",
    "debugpy>=1.8.17",
    "isort>=5.12.0",
    "boto3>=1.40.76",
    "boto3-stubs[essential]>=1.40.76",
]

[tool.setuptools.packages.find]
exclude = ["tests", "build"]
